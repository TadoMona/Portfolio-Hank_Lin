
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>我的模型作品集 | Model Collection</title>
  <meta
    name="description"
    content="記錄模型收藏、展示櫃佈置與模型開箱心得的個人作品集。"
  >
  <meta name="theme-color" content="#ffffff">

  <style>
    /* ===== 1. 全站基本設定 ===== */
    :root {
      --bg: #ffffff;
      --surface: #f7f8fa;
      --text: #242424;
      --muted: #777777;
      --border: #e9e9e9;
      --accent: #333333;
      --radius: 16px;
      --content-width: 1080px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans TC",
        "Microsoft JhengHei", sans-serif;
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #8aa9d6;
      outline-offset: 4px;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .container {
      width: min(
        var(--content-width),
        calc(100% - 40px)
      );
      margin-inline: auto;
    }

    /* ===== 2. 頂部導覽列 ===== */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .nav-inner {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 14px;
      color: #555;
    }

    .nav-links a:hover {
      color: #000;
    }

    /* ===== 3. 個人介紹 ===== */
    .hero {
      padding: 64px 0 34px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.25;
      letter-spacing: 0.03em;
    }

    .hero-description {
      max-width: 560px;
      margin: 18px auto 0;
      color: var(--muted);
      font-size: 15px;
    }

    .hero-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 26px;
      padding: 11px 23px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: var(--accent);
      color: white;
      font-size: 14px;
      transition:
        background 0.2s,
        color 0.2s;
    }

    .hero-button:hover {
      background: white;
      color: var(--accent);
    }

    /* ===== 4. 圖片輪播 ===== */
    .gallery-section {
      padding: 20px 0 72px;
    }

    .carousel {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      background: #f0f0f0;
      isolation: isolate;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.55s ease;
      will-change: transform;
    }

    .slide {
      position: relative;
      flex: 0 0 100%;
      min-width: 0;
      aspect-ratio: 2 / 1;
      overflow: hidden;
      background: #eeeeee;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /*.slide::after {
      position: absolute;
      inset: 45% 0 0;
      content: "";
      background: linear-gradient(
        transparent,
        rgba(0, 0, 0, 0.62)
      );
      pointer-events: none;
    }*/

    .slide-caption {
      position: absolute;
      z-index: 1;
      right: 8%;
      bottom: 8%;
      left: 8%;
      color: white;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.3);
    }

    .slide-caption small {
      font-size: 11px;
      letter-spacing: 0.18em;
    }

    .slide-caption h2 {
      margin: 4px 0 0;
      font-size: clamp(18px, 3vw, 30px);
      line-height: 1.4;
    }

    .carousel-button {
      position: absolute;
      z-index: 2;
      top: 50%;
      display: grid;
      width: 42px;
      height: 42px;
      padding: 0;
      place-items: center;
      transform: translateY(-50%);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.88);
      color: #222;
      font-size: 23px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .carousel-button:hover {
      background: white;
    }

    .carousel-button.prev {
      left: 16px;
    }

    .carousel-button.next {
      right: 16px;
    }

    .carousel-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding-top: 18px;
    }

    .carousel-dots {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .carousel-dot {
      width: 8px;
      height: 8px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #d3d3d3;
      cursor: pointer;
      transition:
        width 0.2s,
        background 0.2s;
    }

    .carousel-dot.active {
      width: 24px;
      border-radius: 8px;
      background: #333;
    }

    .slide-counter {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    /* ===== 5. 區塊標題 ===== */
    .section {
      padding: 56px 0 76px;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .section-heading .eyebrow {
      margin-bottom: 5px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: clamp(25px, 4vw, 32px);
      line-height: 1.4;
    }

    .section-subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .work-count {
      flex-shrink: 0;
      color: var(--muted);
      font-size: 13px;
    }

    /* ===== 6. 文章作品卡片 ===== */
    .works-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    .work-card {
      display: flex;
      min-width: 0;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: white;
      transition:
        transform 0.22s,
        box-shadow 0.22s;
    }

    .work-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.06);
    }

    .work-cover {
      position: relative;
      display: grid;
      min-height: 145px;
      aspect-ratio: 16 / 7;
      place-items: center;
      overflow: hidden;
      background: var(--surface);
    }

    .work-cover img {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      object-fit: cover;
    }

    .cover-placeholder {
      padding: 20px;
      color: #999;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.22em;
    }

    .work-body {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: flex-start;
      padding: 22px;
    }

    .work-category {
      margin: 0 0 8px;
      color: #858585;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.13em;
    }

    .work-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .work-description {
      margin: 10px 0 22px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .work-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: auto;
      padding-bottom: 3px;
      border-bottom: 1px solid #bbb;
      font-size: 13px;
      font-weight: 700;
    }

    .work-link:hover {
      border-color: #222;
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 35px 20px;
      border: 1px dashed #ddd;
      border-radius: var(--radius);
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    /* ===== 7. 關於我 ===== */
    .about-section {
      background: var(--surface);
    }

    .about-content {
      max-width: 700px;
      margin: 0 auto;
      text-align: center;
    }

    .about-content h2 {
      margin: 0 0 16px;
      font-size: 28px;
    }

    .about-content p {
      margin: 0;
      color: #666;
      font-size: 15px;
    }

    /* ===== 8. 頁尾 ===== */
    .footer {
      padding: 30px 0;
      border-top: 1px solid var(--border);
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font-size: 12px;
    }

    .footer a {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ===== 9. 手機版響應式排版 ===== */
    @media (max-width: 640px) {
      .container {
        width: calc(100% - 28px);
      }

      .nav-inner {
        min-height: 60px;
        gap: 12px;
      }

      .brand {
        font-size: 15px;
      }

      .nav-links {
        gap: 14px;
        font-size: 12px;
      }

      .hero {
        padding-top: 46px;
      }

      .hero-description {
        font-size: 14px;
      }

      .gallery-section {
        padding-bottom: 40px;
      }

      .carousel {
        border-radius: 10px;
      }

      .slide-caption {
        right: 5%;
        bottom: 6%;
        left: 5%;
      }

      .slide-caption small {
        font-size: 9px;
      }

      .slide-caption h2 {
        font-size: 16px;
      }

      .carousel-button {
        width: 32px;
        height: 32px;
        font-size: 18px;
      }

      .carousel-button.prev {
        left: 8px;
      }

      .carousel-button.next {
        right: 8px;
      }

      .section {
        padding: 42px 0 54px;
      }

      .section-heading {
        align-items: start;
      }

      .works-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .work-cover {
        min-height: 120px;
      }

      .work-body {
        padding: 18px;
      }

      .work-title {
        font-size: 17px;
      }

      .footer-inner {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    /* 尊重使用者減少動畫的偏好 */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }

    
  /* ===== 巴哈姆特文章嵌入 ===== */

  .work-card {
    min-width: 0;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #fff;
  }

  .work-embed-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.08em;
  }

  .work-embed {
    display: block;
    width: 100%;
    height: 657px;
    border: 0;
    background: #fff;
  }

  @media (max-width: 640px) {
    .work-embed {
      height: 657px;
    }
  }

  </style>
</head>

<body>

  <!-- ===== 導覽列 ===== -->
  <header class="navbar">
    <div class="container nav-inner">
      <a class="brand" href="#home">MY PORTFOLIO</a>

      <nav class="nav-links" aria-label="主要導覽">
        <a href="#gallery">收藏展示</a>
        <a href="#works">開箱文章</a>
        <a href="#about">關於我</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- ===== 個人介紹 ===== -->
    <section class="hero container" id="home">
      <p class="eyebrow">MY COLLECTION / MY STORY</p>

      <h1>我的模型收藏作品集</h1>

      <p class="hero-description">
        收藏喜愛的模型，記錄每一次開箱的感動。
        歡迎來到我的模型展示空間。
      </p>

      <a class="hero-button" href="#gallery">
        探索我的收藏 ↓
      </a>
    </section>

    <!-- ===== 五張圖片輪播 ===== -->
    <section class="gallery-section container" id="gallery">
      <div
        class="carousel"
        id="carousel"
        role="region"
        aria-label="模型收藏圖片輪播"
        aria-roledescription="輪播"
      >
        <div class="carousel-track" id="carouselTrack">
          <!-- 由 JavaScript 自動產生五張圖片 -->
        </div>

        <button
          class="carousel-button prev"
          id="prevButton"
          type="button"
          aria-label="上一張圖片"
        >&#8249;</button>

        <button
          class="carousel-button next"
          id="nextButton"
          type="button"
          aria-label="下一張圖片"
        >&#8250;</button>
      </div>

      <div class="carousel-footer">
        <div
          class="carousel-dots"
          id="carouselDots"
          aria-label="選擇圖片"
        ></div>

        <span class="slide-counter" id="slideCounter">
          01 / 05
        </span>
      </div>
    </section>

    
  <!-- ===== 六篇巴哈姆特嵌入文章 ===== -->
  <section class="section container" id="works">
    <div class="section-heading">
      <div>
        <p class="eyebrow">ARTICLES & REVIEWS</p>
        <h2>開箱與收藏紀錄</h2>
        <p class="section-subtitle">
          模型收藏、開箱與心得分享。
        </p>
      </div>

      <span class="work-count">SELECTED WORKS / 06</span>
    </div>

    <div class="works-grid" id="worksGrid">
      <!-- 六篇文章由 JavaScript 自動產生 -->
    </div>
  </section>


    <!-- ===== 關於我 ===== -->
    <section class="section about-section" id="about">
      <div class="container about-content">
        <p class="eyebrow">ABOUT MY COLLECTION</p>

        <h2>關於這個作品集</h2>

        <p>
          這裡收藏了我喜愛的模型、展示櫃佈置，
          以及分享開箱心得的文章。
          希望透過照片與文字，記錄每一件作品的特色。
        </p>
      </div>
    </section>
  </main>

  <!-- ===== 頁尾 ===== -->
  <footer class="footer">
    <div class="container footer-inner">
      <span>
        © <span id="currentYear"></span> My Model Portfolio
      </span>

      <a
        href="https://forum.gamer.com.tw/"
        target="_blank"
        rel="noopener noreferrer"
      >
        巴哈姆特
      </a>
    </div>
  </footer>

  <script>
    /* =========================================
       A. 輪播圖片設定
       將五張圖片放進 images 資料夾。
       圖片路徑與檔名必須完全一致。
       ========================================= */

    const slides = [
      {
        image: "images/banner-01.jpg",
        /*title: "我的模型收藏",
        subtitle: "MY COLLECTION"*/
      },
      {
        image: "images/banner-02.jpg",
        /*title: "細節與質感",
        subtitle: "DETAILS & CRAFTSMANSHIP"*/
      },
      {
        image: "images/banner-03.jpg",
        /*title: "展示櫃的風景",
        subtitle: "MY DISPLAY SPACE"*/
      },
      {
        image: "images/banner-04.jpg",
        /*title: "喜愛的模型作品",
        subtitle: "FAVORITE MODELS"*/
      },
      {
        image: "images/banner-05.jpg",
        /*title: "收藏的每個瞬間",
        subtitle: "MOMENTS OF JOY"*/
      }
    ];

    
  /* ===== 六篇巴哈姆特文章網址 ===== */

  const articles = [
    {
      title: "文章 01",
      url: "https://forum.gamer.com.tw/embed.php?bsn=60036&sn=328721"
    },
    {
      title: "文章 02",
      url: "https://forum.gamer.com.tw/embed.php?bsn=60036&sn=328721"
    },
    {
      title: "文章 03",
      url: "https://forum.gamer.com.tw/embed.php?bsn=60036&sn=328721"
    },
    {
      title: "文章 04",
      url: "https://forum.gamer.com.tw/embed.php?bsn=60036&sn=328721"
    },
    {
      title: "文章 05",
      url: "https://forum.gamer.com.tw/embed.php?bsn=60036&sn=328721"
    },
    {
      title: "文章 06",
      url: "https://forum.gamer.com.tw/embed.php?bsn=60036&sn=328721"
    }
  ];


    /* =========================================
       C. 產生輪播 HTML
       ========================================= */

    const track = document.getElementById("carouselTrack");
    const dotsContainer = document.getElementById("carouselDots");
    const counter = document.getElementById("slideCounter");
    const carousel = document.getElementById("carousel");

    let currentSlide = 0;
    let autoplayTimer = null;

    const prefersReducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;

    slides.forEach((slide, index) => {
      const slideElement = document.createElement("div");
      slideElement.className = "slide";
      slideElement.setAttribute("role", "group");
      slideElement.setAttribute("aria-roledescription", "投影片");
      slideElement.setAttribute(
        "aria-label",
        `${index + 1} / ${slides.length}`
      );

      const img = document.createElement("img");
      img.src = slide.image;
      img.alt = slide.title;
      img.loading = index === 0 ? "eager" : "lazy";
      img.decoding = "async";

      // 圖片尚未放入專案時，隱藏破圖圖示。
      img.addEventListener("error", () => {
        img.style.display = "none";
      });

      const caption = document.createElement("div");
      caption.className = "slide-caption";

      const subtitle = document.createElement("small");
      subtitle.textContent = slide.subtitle;

      const title = document.createElement("h2");
      title.textContent = slide.title;

      caption.append(subtitle, title);
      slideElement.append(img, caption);
      track.appendChild(slideElement);

      const dot = document.createElement("button");
      dot.className = "carousel-dot";
      dot.type = "button";
      dot.setAttribute("aria-label", `切換至第 ${index + 1} 張圖片`);
      dot.addEventListener("click", () => {
        showSlide(index);
        restartAutoplay();
      });

      dotsContainer.appendChild(dot);
    });

    const dots = Array.from(
      dotsContainer.querySelectorAll(".carousel-dot")
    );

    function showSlide(index) {
      currentSlide = (index + slides.length) % slides.length;

      track.style.transform =
        `translateX(-${currentSlide * 100}%)`;

      dots.forEach((dot, i) => {
        dot.classList.toggle("active", i === currentSlide);
        dot.setAttribute(
          "aria-current",
          i === currentSlide ? "true" : "false"
        );
      });

      counter.textContent =
        `${String(currentSlide + 1).padStart(2, "0")} / ` +
        `${String(slides.length).padStart(2, "0")}`;
    }

    function nextSlide() {
      showSlide(currentSlide + 1);
    }

    function prevSlide() {
      showSlide(currentSlide - 1);
    }

    document
      .getElementById("nextButton")
      .addEventListener("click", () => {
        nextSlide();
        restartAutoplay();
      });

    document
      .getElementById("prevButton")
      .addEventListener("click", () => {
        prevSlide();
        restartAutoplay();
      });

    function stopAutoplay() {
      if (autoplayTimer !== null) {
        clearInterval(autoplayTimer);
        autoplayTimer = null;
      }
    }

    function startAutoplay() {
      stopAutoplay();

      if (prefersReducedMotion || document.hidden) return;

      autoplayTimer = setInterval(nextSlide, 5000);
    }

    function restartAutoplay() {
      startAutoplay();
    }

    // 游標停在輪播上時暫停，方便仔細欣賞照片。
    carousel.addEventListener("mouseenter", stopAutoplay);
    carousel.addEventListener("mouseleave", startAutoplay);
    carousel.addEventListener("focusin", stopAutoplay);
    carousel.addEventListener("focusout", (event) => {
      if (!carousel.contains(event.relatedTarget)) {
        startAutoplay();
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        stopAutoplay();
      } else {
        startAutoplay();
      }
    });

    showSlide(0);
    startAutoplay();

    
    /* ===== D. 產生六篇巴哈姆特嵌入文章 ===== */

    const worksGrid = document.getElementById("worksGrid");

    articles.forEach((article, index) => {
      const card = document.createElement("article");
      card.className = "work-card";

      const header = document.createElement("div");
      header.className = "work-embed-header";
      header.textContent =
        `MODEL COLLECTION / ${String(index + 1).padStart(2, "0")}`;

      const iframe = document.createElement("iframe");
      iframe.className = "work-embed";
      iframe.src = article.url;
      iframe.title = article.title;
      iframe.loading = index < 2 ? "eager" : "lazy";
      iframe.setAttribute("frameborder", "0");
      iframe.setAttribute("allowtransparency", "true");
      iframe.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");

      card.append(header, iframe);
      worksGrid.appendChild(card);
    });


    /* =========================================
       E. 自動更新頁尾年份
       ========================================= */

    document.getElementById("currentYear").textContent =
      new Date().getFullYear();
  </script>
</body>
</html>
