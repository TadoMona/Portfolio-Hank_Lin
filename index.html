
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>我的模型作品集 | Model Collection</title>
  <meta
    name="description"
    content="記錄模型收藏、展示櫃佈置與模型開箱心得的個人作品集。"
  >
  <meta name="theme-color" content="#ffffff">

  <style>
    /* ===== 1. 全站基本設定 ===== */
    :root {
      --bg: #ffffff;
      --surface: #f7f8fa;
      --text: #242424;
      --muted: #777777;
      --border: #e9e9e9;
      --accent: #333333;
      --radius: 16px;
      --content-width: 1080px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans TC",
        "Microsoft JhengHei", sans-serif;
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #8aa9d6;
      outline-offset: 4px;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .container {
      width: min(
        var(--content-width),
        calc(100% - 40px)
      );
      margin-inline: auto;
    }

    /* ===== 2. 頂部導覽列 ===== */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .nav-inner {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 14px;
      color: #555;
    }

    .nav-links a:hover {
      color: #000;
    }

    /* ===== 3. 個人介紹 ===== */
    .hero {
      padding: 64px 0 34px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.25;
      letter-spacing: 0.03em;
    }

    .hero-description {
      max-width: 560px;
      margin: 18px auto 0;
      color: var(--muted);
      font-size: 15px;
    }

    .hero-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 26px;
      padding: 11px 23px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: var(--accent);
      color: white;
      font-size: 14px;
      transition:
        background 0.2s,
        color 0.2s;
    }

    .hero-button:hover {
      background: white;
      color: var(--accent);
    }

    /* ===== 4. 圖片輪播 ===== */
    .gallery-section {
      padding: 20px 0 72px;
    }

    .carousel {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      background: #f0f0f0;
      isolation: isolate;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.55s ease;
      will-change: transform;
    }

    .slide {
      position: relative;
      flex: 0 0 100%;
      min-width: 0;
      aspect-ratio: 2 / 1;
      overflow: hidden;
      background: #eeeeee;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .slide-caption {
      position: absolute;
      z-index: 1;
      right: 8%;
      bottom: 8%;
      left: 8%;
      color: white;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.3);
    }

    .slide-caption small {
      font-size: 11px;
      letter-spacing: 0.18em;
    }

    .slide-caption h2 {
      margin: 4px 0 0;
      font-size: clamp(18px, 3vw, 30px);
      line-height: 1.4;
    }

    .carousel-button {
      position: absolute;
      z-index: 2;
      top: 50%;
      display: grid;
      width: 42px;
      height: 42px;
      padding: 0;
      place-items: center;
      transform: translateY(-50%);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.88);
      color: #222;
      font-size: 23px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .carousel-button:hover {
      background: white;
    }

    .carousel-button.prev {
      left: 16px;
    }

    .carousel-button.next {
      right: 16px;
    }

    .carousel-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding-top: 18px;
    }

    .carousel-dots {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .carousel-dot {
      width: 8px;
      height: 8px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #d3d3d3;
      cursor: pointer;
      transition:
        width 0.2s,
        background 0.2s;
    }

    .carousel-dot.active {
      width: 24px;
      border-radius: 8px;
      background: #333;
    }

    .slide-counter {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    /* ===== 5. 區塊標題 ===== */
    .section {
      padding: 56px 0 76px;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .section-heading .eyebrow {
      margin-bottom: 5px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: clamp(25px, 4vw, 32px);
      line-height: 1.4;
    }

    .section-subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .work-count {
      flex-shrink: 0;
      color: var(--muted);
      font-size: 13px;
    }

    /* ===== 6. 文章作品卡片 ===== */
    .works-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    .work-card {
      display: flex;
      min-width: 0;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: white;
      transition:
        transform 0.22s,
        box-shadow 0.22s;
    }

    .work-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.06);
    }

    .work-cover {
      position: relative;
      display: grid;
      min-height: 145px;
      aspect-ratio: 7 / 5;
      place-items: center;
      overflow: hidden;
      background: var(--surface);
    }

    .work-cover img {
      width: 100%;
      height: 100%;
      aspect-ratio: 7 / 5;
      position: absolute;
      inset: 0;
      object-fit: cover;
      display: block;
    }

    .cover-placeholder {
      padding: 20px;
      color: #999;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.22em;
    }

    .work-body {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: flex-start;
      padding: 22px;
    }

    .work-category {
      margin: 0 0 8px;
      color: #858585;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.13em;
    }

    .work-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .work-description {
      margin: 10px 0 22px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .work-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: auto;
      padding-bottom: 3px;
      border-bottom: 1px solid #bbb;
      font-size: 13px;
      font-weight: 700;
    }

    .work-link:hover {
      border-color: #222;
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 35px 20px;
      border: 1px dashed #ddd;
      border-radius: var(--radius);
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    /* ===== 7. 關於我 ===== */
    .about-section {
      background: var(--surface);
    }

    .about-content {
      max-width: 700px;
      margin: 0 auto;
      text-align: center;
    }

    .about-content h2 {
      margin: 0 0 16px;
      font-size: 28px;
    }

    .about-content p {
      margin: 0;
      color: #666;
      font-size: 15px;
    }

    /* ===== 8. 頁尾 ===== */
    .footer {
      padding: 30px 0;
      border-top: 1px solid var(--border);
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font-size: 12px;
    }

    .footer a {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ===== 9. 手機版響應式排版 ===== */
    @media (max-width: 640px) {
      .container {
        width: calc(100% - 28px);
      }

      .nav-inner {
        min-height: 60px;
        gap: 12px;
      }

      .brand {
        font-size: 15px;
      }

      .nav-links {
        gap: 14px;
        font-size: 12px;
      }

      .hero {
        padding-top: 46px;
      }

      .hero-description {
        font-size: 14px;
      }

      .gallery-section {
        padding-bottom: 40px;
      }

      .carousel {
        border-radius: 10px;
      }

      .slide-caption {
        right: 5%;
        bottom: 6%;
        left: 5%;
      }

      .slide-caption small {
        font-size: 9px;
      }

      .slide-caption h2 {
        font-size: 16px;
      }

      .carousel-button {
        width: 32px;
        height: 32px;
        font-size: 18px;
      }

      .carousel-button.prev {
        left: 8px;
      }

      .carousel-button.next {
        right: 8px;
      }

      .section {
        padding: 42px 0 54px;
      }

      .section-heading {
        align-items: start;
      }

      .works-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .work-cover {
        min-height: 120px;
      }

      .work-body {
        padding: 18px;
      }

      .work-title {
        font-size: 17px;
      }

      .footer-inner {
        flex-direction: column;
        align-items: flex-start;
      }
    }
    .round-img {
      width: 150px;
      height: 150px;
      display: block;
      margin-left: auto;
      margin-right: auto;
      margin-top: -5px;
      margin-bottom: 20px;
      object-fit: cover;
      border-radius: 50%;
    }

    /* 尊重使用者減少動畫的偏好 */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- ===== 導覽列 ===== -->
  <header class="navbar">
    <div class="container nav-inner">

      <nav class="nav-links" aria-label="主要導覽">

  <main>
    <!-- ===== 個人介紹 ===== -->
    <section class="hero container" id="home">

    <!-- ===== 五張圖片輪播 ===== -->
    <section class="gallery-section container" id="gallery">
      <div
        class="carousel"
        id="carousel"
        role="region"
        aria-label="模型收藏圖片輪播"
        aria-roledescription="輪播"
      >
        <div class="carousel-track" id="carouselTrack">
          <!-- 由 JavaScript 自動產生五張圖片 -->
        </div>

        <button
          class="carousel-button prev"
          id="prevButton"
          type="button"
          aria-label="上一張圖片"
        >&#8249;</button>

        <button
          class="carousel-button next"
          id="nextButton"

        >&#8250;</button>

      <div class="carousel-footer">

          class="carousel-dots"

        </span>

    <!-- ===== 六篇巴哈姆特嵌入文章 ===== -->
    <section class="section container" id="works">
      <div class="section-heading">
        <div>
          <p class="eyebrow">ARTICLES</p>

          <p class="section-subtitle">

          </p>
        </div>
      </div>

      <div class="works-grid" id="worksGrid">
        <!-- 六篇文章由 JavaScript 自動產生 -->
      </div>
    </section>


    <!-- ===== 關於我 ===== -->
    <section class="section about-section" id="about">
      <div class="container about-content">
        <p class="eyebrow">ABOUT ME</p>

        <h2>林柏翰</h2>
        <img src="images/me.jpg" class="round-img">
        <p></p>
        <p>
          建立這個網站記錄了我收藏的模型、展示櫃佈置，以及分享開箱心得的文章。
        </p>
        <p>
        希望透過這些照片與簡短的文字，記錄每一件作品的特色。
        </p>
      </div>
    </section>
  </main>

  <!-- ===== 頁尾 ===== -->
  <footer class="footer">
    <div class="container footer-inner">
      <span>
        © <span id="currentYear"></span> My Portfolio
      </span>

      <a
        href="https://home.gamer.com.tw/profile/index.php?owner=tadomona"
        target="_blank"
        rel="noopener noreferrer"
      >
        巴哈姆特
      </a>
    </div>
  </footer>

  <script>
    
    /* =========================================
       A. 輪播圖片設定
       將五張圖片放進 images 資料夾。
       圖片路徑與檔名必須完全一致。
       ========================================= */

    const slides = [
      {
        image: "images/banner-01.jpg",
      },
      {
        image: "images/banner-02.jpg",
      },
      {
        image: "images/banner-03.jpg",
      },
      {
        image: "images/banner-04.jpg",
      },
      {
        image: "images/banner-05.jpg",
      }
    ];

    /* =========================================
       B. 巴哈姆特文章設定
       請將 title、description、url 改成實際資料。

       cover 可以填入文章封面圖片路徑。
       若暫時沒有封面，請保留空字串 ""。
       ========================================= */

    const articles = [
      {
        title: "【心得】[amiami x AMAKUNI]《輝夜姬想讓人告白》早坂愛 PVC 簡單分享",
        description: "這隻真的是自己非常期待又等了很久的模型，從2021年9月到最近終於發貨了～那年夏天剛好被推坑這部動畫，看完就特別喜歡早坂這個角色，看到消息就馬上預訂了...",
        url: "https://forum.gamer.com.tw/Co.php?bsn=60036&sn=328721",
        cover: "images/article-01.jpg",
      },
      {
        title: "【心得】[Spiritale] 櫻未來～桜妖精ver (1/7比例) 隨便拍拍分享",
        description: "能在跨年連假期間收到這款PVC真的很高興，從原本預定9月發售，到延期至11月，最後12月中才發貨，原本以為要到1月多才能到手...",
        url: "https://forum.gamer.com.tw/Co.php?bsn=60036&sn=320252",
        cover: "images/article-02.jpg",
      },
      {
        title: "【開箱】空阿夸～壽屋《Hololive production》湊あくあ 一般版　簡單開箱",
        description: "這款１月開放預購的Aqua在經過六個月的等待終於在７月底發售了但我的貨是走海運的，在海上漂流了快一個月才到我手裡，果然是海之女僕...",
        url: "https://forum.gamer.com.tw/Co.php?bsn=60036&sn=316647",
        cover: "images/article-03.jpg",
      },
      {
        title: "【心得】[GSC] POP UP PARADE《輝夜姬想讓人告白》四宮輝夜 簡單分享",
        description: "想說平常PUP一些角色都會有人拍開箱，這隻發貨到現在差不多兩個禮拜了，沒看到有人上來分享，所以就想說自己拍幾張來分享順便騙騙GP...",
        url: "https://forum.gamer.com.tw/Co.php?bsn=60036&sn=323620",
        cover: "images/article-04.jpg",
      },
      {
        title: "【心得】[AniGift] 彩虹社Vtuber - 本間向日葵 (本間ひまわり) 開箱分享",
        description: "NIJISANJI旗下Vtuber本間向日葵在2018年7月6日開始活動，NIJISANJI GAMERS的一員，形象上最典型的特徵為頭上的向日葵，自稱是向日葵是本體，還有其作為高中二年級生的校園制服造型...",
        url: "https://forum.gamer.com.tw/Co.php?bsn=60036&sn=324093",
        cover: "images/article-05.jpg",
      },
      {
        title: "【心得】[壽屋] 彩虹社Vtuber - 莉澤‧赫露艾斯塔 (リゼ・ヘルエスタ) 開箱分享",
        description: "赫露艾斯塔王國的第二皇女，文武兩全學園主席、認真又溫柔待人因而有著相當的人望。作為王位繼承的資格者日夜鍛鍊、重視著與人的交流...",
        url: "https://forum.gamer.com.tw/Co.php?bsn=60036&sn=322421",
        cover: "images/article-06.jpg",
      }
    ];

    /* =========================================
       C. 產生輪播 HTML
       ========================================= */

    const track = document.getElementById("carouselTrack");
    const dotsContainer = document.getElementById("carouselDots");
    const counter = document.getElementById("slideCounter");
    const carousel = document.getElementById("carousel");

    let currentSlide = 0;
    let autoplayTimer = null;

    const prefersReducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;

    slides.forEach((slide, index) => {
      const slideElement = document.createElement("div");
      slideElement.className = "slide";
      slideElement.setAttribute("role", "group");
      slideElement.setAttribute("aria-roledescription", "投影片");
      slideElement.setAttribute(
        "aria-label",
        `${index + 1} / ${slides.length}`
      );

      const img = document.createElement("img");
      img.src = slide.image;
      img.alt = slide.title;
      img.loading = index === 0 ? "eager" : "lazy";
      img.decoding = "async";

      // 圖片尚未放入專案時，隱藏破圖圖示。
      img.addEventListener("error", () => {
        img.style.display = "none";
      });

      const caption = document.createElement("div");
      caption.className = "slide-caption";

      const subtitle = document.createElement("small");
      subtitle.textContent = slide.subtitle;

      const title = document.createElement("h2");
      title.textContent = slide.title;

      caption.append(subtitle, title);
      slideElement.append(img, caption);
      track.appendChild(slideElement);

      const dot = document.createElement("button");
      dot.className = "carousel-dot";
      dot.type = "button";
      dot.setAttribute("aria-label", `切換至第 ${index + 1} 張圖片`);
      dot.addEventListener("click", () => {
        showSlide(index);
        restartAutoplay();
      });

      dotsContainer.appendChild(dot);
    });

    const dots = Array.from(
      dotsContainer.querySelectorAll(".carousel-dot")
    );

    function showSlide(index) {
      currentSlide = (index + slides.length) % slides.length;

      track.style.transform =
        `translateX(-${currentSlide * 100}%)`;

      dots.forEach((dot, i) => {
        dot.classList.toggle("active", i === currentSlide);
        dot.setAttribute(
          "aria-current",
          i === currentSlide ? "true" : "false"
        );
      });

      counter.textContent =
        `${String(currentSlide + 1).padStart(2, "0")} / ` +
        `${String(slides.length).padStart(2, "0")}`;
    }

    function nextSlide() {
      showSlide(currentSlide + 1);
    }

    function prevSlide() {
      showSlide(currentSlide - 1);
    }

    document
      .getElementById("nextButton")
      .addEventListener("click", () => {
        nextSlide();
        restartAutoplay();
      });

    document
      .getElementById("prevButton")
      .addEventListener("click", () => {
        prevSlide();
        restartAutoplay();
      });

    function stopAutoplay() {
      if (autoplayTimer !== null) {
        clearInterval(autoplayTimer);
        autoplayTimer = null;
      }
    }

    function startAutoplay() {
      stopAutoplay();

      if (prefersReducedMotion || document.hidden) return;

      autoplayTimer = setInterval(nextSlide, 5000);
    }

    function restartAutoplay() {
      startAutoplay();
    }

    // 游標停在輪播上時暫停，方便仔細欣賞照片。
    carousel.addEventListener("mouseenter", stopAutoplay);
    carousel.addEventListener("mouseleave", startAutoplay);
    carousel.addEventListener("focusin", stopAutoplay);
    carousel.addEventListener("focusout", (event) => {
      if (!carousel.contains(event.relatedTarget)) {
        startAutoplay();
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        stopAutoplay();
      } else {
        startAutoplay();
      }
    });

    showSlide(0);
    startAutoplay();

    /* =========================================
       D. 產生文章卡片
       ========================================= */

    const worksGrid = document.getElementById("worksGrid");

    articles.forEach((article, index) => {
      const card = document.createElement("article");
      card.className = "work-card";

      const cover = document.createElement("div");
      cover.className = "work-cover";

      if (article.cover) {
        const img = document.createElement("img");
        img.src = article.cover;
        img.alt = "";
        img.className = "work-cover";

        img.loading = "lazy";
        img.decoding = "async";

        img.addEventListener("load", () => {
          placeholder.style.display = "none";
        });

        img.addEventListener("error", () => {
          img.remove();
        });

        cover.appendChild(img);
      }

      const body = document.createElement("div");
      body.className = "work-body";

      const category = document.createElement("p");
      category.className = "work-category";
      category.textContent = article.category;

      const title = document.createElement("h3");
      title.className = "work-title";
      title.textContent = article.title;

      const description = document.createElement("p");
      description.className = "work-description";
      description.textContent = article.description;

      const link = document.createElement("a");
      link.className = "work-link";
      link.href = article.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "閱讀完整文章 ↗";
      link.setAttribute(
        "aria-label",
        `閱讀文章：${article.title}（另開新視窗）`
      );

      body.append(category, title, description, link);
      card.append(cover, body);
      worksGrid.appendChild(card);
    });

    /* =========================================
       E. 自動更新頁尾年份
       =========================================*/

    document.getElementById("currentYear").textContent =
      new Date().getFullYear(); 
  </script>
</body>
</html>
